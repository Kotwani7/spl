services:
  - type: web
    name: spl-website
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      python -m pip install -r requirements.txt -c requirements-lock.txt &&
      python manage.py migrate --noinput &&
      python manage.py import_season_json --file data/season1.json --season 1 &&
      python manage.py import_season_json --file data/season2.json --season 2 &&
      python manage.py import_season_json --file data/season3.json --season 3 &&
      python manage.py collectstatic --no-input
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
