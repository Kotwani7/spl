databases:
  - name: spl-production-db
    databaseName: spl
    user: spl
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1

services:
  - type: web
    name: spl-website
    runtime: python
    plan: starter
    region: singapore
    buildCommand: python -m pip install -r requirements.txt -c requirements-lock.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: spl-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spl-production-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
